<!-- ── dmc.svg ────────────────────────────────────────────────────────────── -->
<!-- Digital Messaging Core -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- Anneau externe -->
  <circle cx="12" cy="12" r="9.5" stroke="#16a34a" stroke-width="1.5"
          stroke-dasharray="3 2" fill="none" opacity="0.4"/>
  <!-- Anneau intermédiaire -->
  <circle cx="12" cy="12" r="6.5" stroke="#16a34a" stroke-width="1.5"
          fill="rgba(34,197,94,.06)"/>
  <!-- Nœud central -->
  <circle cx="12" cy="12" r="3" fill="#16a34a" opacity="0.9"/>
  <!-- Rayons de connexion -->
  <line x1="12" y1="5.5" x2="12" y2="9"   stroke="#16a34a" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="12" y1="15"  x2="12" y2="18.5" stroke="#16a34a" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="5.5" y1="12" x2="9"   y2="12" stroke="#16a34a" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="15"  y1="12" x2="18.5" y2="12" stroke="#16a34a" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Diagonales -->
  <line x1="7.5"  y1="7.5"  x2="9.8"  y2="9.8"  stroke="#16a34a" stroke-width="1"
        stroke-linecap="round" opacity="0.5"/>
  <line x1="14.2" y1="14.2" x2="16.5" y2="16.5" stroke="#16a34a" stroke-width="1"
        stroke-linecap="round" opacity="0.5"/>
  <line x1="16.5" y1="7.5"  x2="14.2" y2="9.8"  stroke="#16a34a" stroke-width="1"
        stroke-linecap="round" opacity="0.5"/>
  <line x1="9.8"  y1="14.2" x2="7.5"  y2="16.5" stroke="#16a34a" stroke-width="1"
        stroke-linecap="round" opacity="0.5"/>
  <!-- Pulsation centre -->
  <circle cx="12" cy="12" r="1.5" fill="white" opacity="0.9"/>
</svg>