
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- Boîtier gateway -->
  <rect x="2" y="8" width="16" height="10" rx="2.5"
        stroke="#d97706" stroke-width="1.5" fill="rgba(245,158,11,.1)"/>
  <!-- Connecteur gauche -->
  <rect x="2" y="11" width="2" height="4" rx="1"
        fill="#d97706" opacity="0.6"/>
  <!-- Indicateurs LED -->
  <circle cx="6"  cy="13" r="1.2" fill="#d97706" opacity="0.9"/>
  <circle cx="9"  cy="13" r="1.2" fill="#d97706" opacity="0.5"/>
  <circle cx="12" cy="13" r="1.2" fill="#d97706" opacity="0.3"/>
  <!-- Port RJ45 -->
  <rect x="14" y="11.5" width="3.5" height="3" rx="0.5"
        stroke="#d97706" stroke-width="1" fill="none"/>
  <!-- Antenne -->
  <path d="M20 3L22 1" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M20 7L23 5" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M20 11L23 9" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="19" y1="3" x2="19" y2="18" stroke="#d97706" stroke-width="1.5"
        stroke-linecap="round"/>
  <!-- Onde radio -->
  <path d="M17 5.5C17.8 4.7 18 3.5 17.5 2.5" stroke="#d97706" stroke-width="1"
        stroke-linecap="round" opacity="0.4"/>
</svg>

 