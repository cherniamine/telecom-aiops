<!-- ── smpps.svg ──────────────────────────────────────────────────────────── -->
<!-- SMPP Server (incoming connections) -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- Serveur central -->
  <rect x="7" y="5" width="10" height="14" rx="2.5"
        stroke="#2563eb" stroke-width="1.5" fill="rgba(59,130,246,.1)"/>
  <!-- Grilles serveur -->
  <line x1="9" y1="8.5"  x2="15" y2="8.5"  stroke="#2563eb" stroke-width="1"
        stroke-linecap="round"/>
  <line x1="9" y1="11"   x2="15" y2="11"   stroke="#2563eb" stroke-width="1"
        stroke-linecap="round" opacity="0.6"/>
  <line x1="9" y1="13.5" x2="13" y2="13.5" stroke="#2563eb" stroke-width="1"
        stroke-linecap="round" opacity="0.4"/>
  <!-- LED -->
  <circle cx="14" cy="16" r="1.2" fill="#2563eb"/>
  <!-- Flèches entrantes (connexions SMPP) -->
  <path d="M1 8l3 0M1 12l3 0M1 16l3 0"
        stroke="#2563eb" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M2 7l2 1-2 1"   stroke="#2563eb" stroke-width="1.2"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M2 11l2 1-2 1"  stroke="#2563eb" stroke-width="1.2"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M2 15l2 1-2 1"  stroke="#2563eb" stroke-width="1.2"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Indicateur IN -->
  <rect x="18" y="10.5" width="5" height="3" rx="1"
        fill="#2563eb" opacity="0.15" stroke="#2563eb" stroke-width="1"/>
  <text x="19.2" y="12.7" font-family="monospace" font-size="3.5"
        fill="#2563eb" font-weight="700">IN</text>
</svg>