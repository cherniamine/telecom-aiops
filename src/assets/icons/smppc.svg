<!-- ── smppc.svg ──────────────────────────────────────────────────────────── -->
<!-- SMPP Client (outgoing connections) -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- Serveur central -->
  <rect x="7" y="5" width="10" height="14" rx="2.5"
        stroke="#4f46e5" stroke-width="1.5" fill="rgba(99,102,241,.1)"/>
  <!-- Grilles serveur -->
  <line x1="9" y1="8.5"  x2="15" y2="8.5"  stroke="#4f46e5" stroke-width="1"
        stroke-linecap="round"/>
  <line x1="9" y1="11"   x2="15" y2="11"   stroke="#4f46e5" stroke-width="1"
        stroke-linecap="round" opacity="0.6"/>
  <line x1="9" y1="13.5" x2="13" y2="13.5" stroke="#4f46e5" stroke-width="1"
        stroke-linecap="round" opacity="0.4"/>
  <!-- LED violet -->
  <circle cx="14" cy="16" r="1.2" fill="#4f46e5"/>
  <!-- Flèches sortantes (connexions SMPP) -->
  <path d="M20 8h3M20 12h3M20 16h3"
        stroke="#4f46e5" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M21 7l2 1-2 1"  stroke="#4f46e5" stroke-width="1.2"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M21 11l2 1-2 1" stroke="#4f46e5" stroke-width="1.2"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M21 15l2 1-2 1" stroke="#4f46e5" stroke-width="1.2"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Indicateur OUT -->
  <rect x="1" y="10.5" width="6" height="3" rx="1"
        fill="#4f46e5" opacity="0.15" stroke="#4f46e5" stroke-width="1"/>
  <text x="2" y="12.7" font-family="monospace" font-size="3"
        fill="#4f46e5" font-weight="700">OUT</text>
</svg>