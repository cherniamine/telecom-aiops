<!-- ── smsc.svg ───────────────────────────────────────────────────────────── -->
<!-- Short Message Service Center -->

<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- Rack serveur -->
  <rect x="3" y="3" width="18" height="18" rx="3"
        stroke="#dc2626" stroke-width="1.5" fill="rgba(239,68,68,.1)"/>
  <!-- Slots serveur -->
  <rect x="5.5" y="6"   width="13" height="3" rx="1"
        stroke="#dc2626" stroke-width="1" fill="rgba(239,68,68,.08)"/>
  <rect x="5.5" y="10.5" width="13" height="3" rx="1"
        stroke="#dc2626" stroke-width="1" fill="rgba(239,68,68,.08)"/>
  <rect x="5.5" y="15"  width="13" height="3" rx="1"
        stroke="#dc2626" stroke-width="1" fill="rgba(239,68,68,.08)"/>
  <!-- LED actifs -->
  <circle cx="16.5" cy="7.5"  r="1" fill="#dc2626"/>
  <circle cx="16.5" cy="12"   r="1" fill="#dc2626" opacity="0.5"/>
  <circle cx="16.5" cy="16.5" r="1" fill="#22c55e"/>
  <!-- Message SMS bulle -->
  <circle cx="19" cy="5" r="4" fill="#dc2626"/>
  <path d="M17 4.5h4M17 6h2.5" stroke="white" stroke-width="1" stroke-linecap="round"/>
  <path d="M17 7.5l1.5 1.5" stroke="#dc2626" stroke-width="1" stroke-linecap="round"/>
</svg>
